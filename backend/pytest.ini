# Pytest configuration

[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    --cov=apps
    --cov-report=term-missing
    --cov-report=html
    --verbose
testpaths = apps
filterwarnings =
    # Ignore deprecation warnings from external libraries we cannot fix
    ignore::DeprecationWarning:dateutil.*:
    ignore::DeprecationWarning:pyasn1.*:
    # Ignore DRF converter registration warning (external library)
    ignore:Converter .* is already registered:django.utils.deprecation.RemovedInDjango60Warning:rest_framework.*:
    # Ignore coroutine warnings from async test patterns
    ignore:coroutine .* was never awaited:RuntimeWarning:
